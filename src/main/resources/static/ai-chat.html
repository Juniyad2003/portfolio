<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Portfolio Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="app-container">
    <aside class="sidebar">

        <nav class="nav-menu">
            <a href="index.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>
            <a href="market.html" class="nav-item">
                <i class="fa-solid fa-magnifying-glass-dollar"></i>
                <span>Market Data</span>
            </a>
            <a href="portfolio.html" class="nav-item">
                <i class="fa-solid fa-briefcase"></i>
                <span>Portfolios</span>
            </a>
            <a href="ai-chat.html" class="nav-item active">
                <i class="fa-solid fa-robot"></i>
                <span>AI Assistant</span>
            </a>
        </nav>

        <div class="user-info">
        </div>
    </aside>

    <main class="main-content">
        <header class="app-header-center">
            <div class="logo-container">
                <i class="fa-solid fa-chart-line brand-gradient"
                   style="font-size: 2.5rem; -webkit-text-fill-color: initial; background: none; color: #6366f1;"></i>
                <h1 class="brand-gradient">FinTrack</h1>
            </div>
            <div class="slogan">Track It; Grow It; Own It</div>
        </header>

        <header class="top-bar">
            <h1 id="page-title">AI Assistant</h1>
        </header>

        <div class="view-section active">
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <div class="message ai">
                        <div class="message-content">
                            Hello! I'm your AI financial assistant. Ask me anything about your portfolios or market
                            trends.
                        </div>
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="ai-input"
                           placeholder="Ask something (e.g., 'Analyze my tech portfolio')...">
                    <button id="send-ai-btn" class="btn primary-btn"><i
                            class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/ai-chat.js"></script>
</body>

</html>
